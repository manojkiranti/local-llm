services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/nrb_notices
      - QDRANT_URL=http://qdrant:6333
      - LLM_BASE_URL=http://ollama:11434/v1
    volumes:
      - ./download:/app/download
      - hf_cache:/root/.cache/huggingface  # persist embedding model — avoids re-download on container restart
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/6333"]
      interval: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/11434"]
      interval: 5s
      retries: 10
    # GPU support: passes all available NVIDIA GPUs to the Ollama container.
    # Requires nvidia-container-toolkit installed on the host.
    # To disable GPU, remove or comment out this entire deploy block.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all       # use all available GPUs; change to e.g. count: 1 to limit
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama
    entrypoint: ["ollama", "pull", "qwen2.5:latest"]

volumes:
  qdrant_data:
  ollama_data:
  hf_cache:
